name: Friday rebuild

# Why this exists.
#
# src/pages/blog/index.astro and rss.xml.js hide any post whose pubDate is still
# in the future. That filter runs at BUILD time, and Cloudflare Pages only builds
# when something is pushed. So a post dated Friday will never appear on its own,
# it appears the next time the site happens to get built.
#
# That is exactly what went wrong in August 2026: five posts were committed on
# 21 Aug, the last push was 25 Aug, and the site sat showing 21 Aug as the newest
# post for a fortnight while the queue stayed invisible.
#
# This job pokes Cloudflare every Friday morning so the week's post goes live on
# its own. It also runs on demand from the Actions tab if a post needs releasing
# early.

on:
  schedule:
    # 07:00 UTC every Friday. That is 08:00 in British Summer Time and 07:00 in
    # winter, so the post is up well before anyone reads the Substack email.
    # GitHub's scheduler can drift by a few minutes under load. That is fine.
    - cron: '0 7 * * 5'
  workflow_dispatch:

# Needed for the fallback path, which pushes an empty commit.
permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Cloudflare Pages build
        id: hook
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "No CLOUDFLARE_DEPLOY_HOOK secret set, falling back to an empty commit."
            echo "used_hook=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
          echo "used_hook=true" >> "$GITHUB_OUTPUT"

      # Fallback so this works with zero setup. Pushing anything to master makes
      # Cloudflare rebuild, and an empty commit is the smallest thing we can push.
      # Add the CLOUDFLARE_DEPLOY_HOOK secret to stop these appearing in the log.
      - name: Check out the repo
        if: steps.hook.outputs.used_hook == 'false'
        uses: actions/checkout@v4

      - name: Push an empty commit to trigger the build
        if: steps.hook.outputs.used_hook == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Weekly rebuild so this Friday's post goes live"
          git push
